<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曾子墨 — 个人主页</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hero {
      text-align: center;
      padding: 60px 0 40px;
    }

    .hero-avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 0 auto 28px;
      overflow: hidden;
      border: 4px solid var(--border);
      box-shadow: 0 0 0 6px var(--primary-light), var(--shadow-lg);
      transition: transform var(--transition);
    }

    .hero-avatar:hover {
      transform: scale(1.04);
    }

    .hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-name {
      font-size: 40px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .hero-tag {
      display: inline-block;
      padding: 4px 16px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .hero-desc {
      color: var(--text-light);
      font-size: 17px;
      max-width: 480px;
      margin: 0 auto 36px;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 60px;
    }

    .feature-card {
      text-align: center;
      padding: 32px 24px;
    }

    .feature-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius);
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 26px;
    }

    .feature-card h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text);
    }

    .feature-card p {
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 768px) {
      .hero {
        padding: 36px 0 20px;
      }
      .hero-name {
        font-size: 30px;
      }
      .hero-avatar {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-logo">Zimo</a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">首页</a></li>
        <li><a href="web/about.html">关于我</a></li>
        <li><a href="web/hobby.html">我的爱好</a></li>
        <li><a href="web/photo.html">我的相册</a></li>
        <li><a href="web/myessay.html">我的随笔</a></li>
        <li><a href="web/contact.html">联系我</a></li>
      </ul>
      <button class="nav-toggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main class="main">
    <section class="hero animate-in">
      <div class="hero-avatar">
        <img src="image/avatar.jpg" alt="曾子墨的头像">
      </div>
      <h1 class="hero-name">曾子墨</h1>
      <span class="hero-tag">华中科技大学 · 计算机科学与技术 2507班</span>
      <p class="hero-desc">
        热爱编程与生活，喜欢探索新技术，享受解决复杂问题的过程。
        在代码的世界里构建属于自己的小天地。
      </p>
      <div class="hero-actions">
        <a href="web/about.html" class="btn">了解更多</a>
        <a href="web/contact.html" class="btn btn-outline">联系我</a>
      </div>
    </section>

    <section class="features">
      <div class="card feature-card animate-in" style="animation-delay: 0.1s">
        <div class="feature-icon">💻</div>
        <h3>编程学习</h3>
        <p>正在学习 C 语言、Python、网页设计，努力成为一名优秀的开发者</p>
      </div>
      <div class="card feature-card animate-in" style="animation-delay: 0.2s">
        <div class="feature-icon">📝</div>
        <h3>随笔记录</h3>
        <p>用文字记录校园生活的点滴，分享学习和成长的感悟</p>
      </div>
      <div class="card feature-card animate-in" style="animation-delay: 0.3s">
        <div class="feature-icon">📷</div>
        <h3>生活相册</h3>
        <p>捕捉日常中的美好瞬间，美食、风景和身边的人</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2025 曾子墨 <span class="heart">❤</span> 好好学习，天天向上</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
