<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">隐私是一组边界，不是一句保证</title><desc id="desc">本次设置减少意外直连风险，但不覆盖外部程序，也不防御所有漏洞、身份关联、恶意软件或大范围流量观察。不能许诺绝对不泄漏。</desc>
<defs><radialGradient id="glow"><stop stop-color="#30273f"/><stop offset="1" stop-color="#11131f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4a7ee"/></marker></defs>
<rect width="1440" height="960" rx="0" fill="url(#glow)"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="64" y="64" fill="#c4a7ee" font-size="18" text-anchor="start" font-weight="400">ZIMO / TOR FIELD NOTES</text><text x="1376" y="64" fill="#c2b9d1" font-size="16" text-anchor="end" font-weight="400">EXPLANATORY FIGURE</text>
<text x="64" y="139" fill="#f6f1fd" font-size="46" text-anchor="start" font-weight="600">隐私是一组边界，不是一句保证</text><text x="64" y="190" fill="#c2b9d1" font-size="24" text-anchor="start" font-weight="400">保留官方抗指纹设计、HTTPS 和更新；不要把新增代理层当作“绝对匿名”。</text>
<rect x="64" y="252" width="1312" height="175" rx="20" fill="#1b1e2e" stroke="#39354b"/><text x="99" y="314" fill="#a9dec8" font-size="37" text-anchor="start" font-weight="400">01</text><text x="187" y="310" fill="#f6f1fd" font-size="31" text-anchor="start" font-weight="400">停止，比悄悄回退更重要</text><text x="187" y="359" fill="#c2b9d1" font-size="25" text-anchor="start" font-weight="400">专用通道失效 → 连接失败</text><text x="187" y="398" fill="#c2b9d1" font-size="25" text-anchor="start" font-weight="400">不把直连当作“自动修复”</text><rect x="64" y="452" width="1312" height="175" rx="20" fill="#1b1e2e" stroke="#39354b"/><text x="99" y="514" fill="#c4a7ee" font-size="37" text-anchor="start" font-weight="400">02</text><text x="187" y="510" fill="#f6f1fd" font-size="31" text-anchor="start" font-weight="400">隔离有范围，不是全机护盾</text><text x="187" y="559" fill="#c2b9d1" font-size="25" text-anchor="start" font-weight="400">覆盖这个启动方式中的浏览器与 Tor</text><text x="187" y="598" fill="#c2b9d1" font-size="25" text-anchor="start" font-weight="400">外部阅读器、其它应用不在此证明内</text><rect x="64" y="652" width="1312" height="175" rx="20" fill="#1b1e2e" stroke="#39354b"/><text x="99" y="714" fill="#e4bd86" font-size="37" text-anchor="start" font-weight="400">03</text><text x="187" y="710" fill="#f6f1fd" font-size="31" text-anchor="start" font-weight="400">匿名也有无法忽略的对手</text><text x="187" y="759" fill="#c2b9d1" font-size="25" text-anchor="start" font-weight="400">登录身份、漏洞、恶意软件、流量关联</text><text x="187" y="798" fill="#c2b9d1" font-size="25" text-anchor="start" font-weight="400">代理服务方与多点观察者仍需考虑</text>
<path d="M64 892 H1376" stroke="#39354b"/><text x="64" y="929" fill="#c2b9d1" font-size="18" text-anchor="start" font-weight="400">概念与观察分开记录 · 示意图不代表真实物理距离或规模</text><text x="1376" y="929" fill="#c4a7ee" font-size="18" text-anchor="end" font-weight="400">zengzimo.cn</text>
</g></svg>