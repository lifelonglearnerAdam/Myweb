<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">.onion：两边在网络里会面</title><desc id="desc">洋葱服务通信的简化图。客户端和服务端通过介绍协议约定会合点，通常分别使用三跳电路，不经过普通网站使用的出口中继。</desc>
<defs><radialGradient id="glow"><stop stop-color="#30273f"/><stop offset="1" stop-color="#11131f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4a7ee"/></marker></defs>
<rect width="1440" height="960" rx="0" fill="url(#glow)"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="64" y="64" fill="#c4a7ee" font-size="18" text-anchor="start" font-weight="400">ZIMO / TOR FIELD NOTES</text><text x="1376" y="64" fill="#c2b9d1" font-size="16" text-anchor="end" font-weight="400">EXPLANATORY FIGURE</text>
<text x="64" y="139" fill="#f6f1fd" font-size="46" text-anchor="start" font-weight="600">.onion：两边在网络里会面</text><text x="64" y="190" fill="#c2b9d1" font-size="24" text-anchor="start" font-weight="400">访问者和服务端各自建立电路，在会合点连接，而不是“出口再找一台隐藏服务器”。</text>
<rect x="64" y="240" width="1312" height="105" rx="20" fill="#1b1e2e" stroke="#39354b"/><text x="100" y="281" fill="#c4a7ee" font-size="29" text-anchor="start" font-weight="400">建立阶段：查询服务描述符，再通过介绍点传递会合信息。</text><text x="100" y="321" fill="#c2b9d1" font-size="23" text-anchor="start" font-weight="400">介绍点帮助建立连接；不是后续数据会合点。此图省略密钥握手细节。</text><path d="M199 458 L357 458" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M457 458 L615 458" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><circle cx="150" cy="458" r="44" fill="#1b1e2e" stroke="#a9dec8" stroke-width="3"/><circle cx="150" cy="458" r="10" fill="#a9dec8"/><text x="150" y="546" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">访问者</text><circle cx="408" cy="458" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="408" cy="458" r="10" fill="#c4a7ee"/><text x="408" y="546" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">入口守卫</text><circle cx="666" cy="458" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="666" cy="458" r="10" fill="#c4a7ee"/><text x="666" y="546" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">中继</text><path d="M715 458 L1058 572" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M199 690 L357 690" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M457 690 L615 690" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><circle cx="150" cy="690" r="44" fill="#1b1e2e" stroke="#a9dec8" stroke-width="3"/><circle cx="150" cy="690" r="10" fill="#a9dec8"/><text x="150" y="778" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">洋葱服务</text><circle cx="408" cy="690" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="408" cy="690" r="10" fill="#c4a7ee"/><text x="408" y="778" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">入口守卫</text><circle cx="666" cy="690" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="666" cy="690" r="10" fill="#c4a7ee"/><text x="666" y="778" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">中继</text><path d="M715 690 L1058 572" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><circle cx="1105" cy="572" r="44" fill="#1b1e2e" stroke="#a9dec8" stroke-width="3"/><circle cx="1105" cy="572" r="10" fill="#a9dec8"/><text x="1105" y="660" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">会合点</text><text x="1105" y="697" fill="#c2b9d1" font-size="20" text-anchor="middle" font-weight="400">Rendezvous point</text><text x="1100" y="807" fill="#a9dec8" font-size="30" text-anchor="middle" font-weight="400">不需要普通出口节点</text>
<path d="M64 892 H1376" stroke="#39354b"/><text x="64" y="929" fill="#c2b9d1" font-size="18" text-anchor="start" font-weight="400">概念与观察分开记录 · 示意图不代表真实物理距离或规模</text><text x="1376" y="929" fill="#c4a7ee" font-size="18" text-anchor="end" font-weight="400">zengzimo.cn</text>
</g></svg>