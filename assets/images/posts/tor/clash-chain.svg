<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">先经过代理，再进入 Tor</title><desc id="desc">浏览器到本地 Tor，然后通过受限转发到 Clash、加密代理节点及 Tor 网络。图不公开本机端口或节点信息；不意味着其它应用同时获得隔离。</desc>
<defs><radialGradient id="glow"><stop stop-color="#30273f"/><stop offset="1" stop-color="#11131f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4a7ee"/></marker></defs>
<rect width="1440" height="960" rx="0" fill="url(#glow)"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="64" y="64" fill="#c4a7ee" font-size="18" text-anchor="start" font-weight="400">ZIMO / TOR FIELD NOTES</text><text x="1376" y="64" fill="#c2b9d1" font-size="16" text-anchor="end" font-weight="400">EXPLANATORY FIGURE</text>
<text x="64" y="139" fill="#f6f1fd" font-size="46" text-anchor="start" font-weight="600">先经过代理，再进入 Tor</text><text x="64" y="190" fill="#c2b9d1" font-size="24" text-anchor="start" font-weight="400">这是本次实验的 Tor-over-proxy 路径，不是“入口和出口都变成同一个 VPN”。</text>
<rect x="64" y="243" width="440" height="261" rx="20" fill="#192627" stroke="#4c7668"/><text x="91" y="290" fill="#a9dec8" font-size="25" text-anchor="start" font-weight="400">本次隔离启动的边界</text><circle cx="165" cy="365" r="44" fill="#1b1e2e" stroke="#a9dec8" stroke-width="3"/><circle cx="165" cy="365" r="10" fill="#a9dec8"/><text x="165" y="453" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">浏览器</text><circle cx="398" cy="365" r="44" fill="#1b1e2e" stroke="#a9dec8" stroke-width="3"/><circle cx="398" cy="365" r="10" fill="#a9dec8"/><text x="398" y="453" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">本地 Tor</text><path d="M216 365 L346 365" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M448 365 L631 365" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><circle cx="680" cy="365" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="680" cy="365" r="10" fill="#c4a7ee"/><text x="680" y="453" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">本机 Clash</text><path d="M729 365 L1088 365" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><circle cx="1137" cy="365" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="1137" cy="365" r="10" fill="#c4a7ee"/><text x="1137" y="453" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">远端代理节点</text><text x="532" y="329" fill="#c2b9d1" font-size="19" text-anchor="middle" font-weight="400">受限转发</text><text x="907" y="314" fill="#c4a7ee" font-size="23" text-anchor="middle" font-weight="400">加密代理连接</text><path d="M1137 418 L1137 615" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1088 668 L903 668" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M803 668 L621 668" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M521 668 L336 668" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><circle cx="1137" cy="668" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="1137" cy="668" r="10" fill="#c4a7ee"/><text x="1137" y="756" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">Tor 入口</text><circle cx="853" cy="668" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="853" cy="668" r="10" fill="#c4a7ee"/><text x="853" y="756" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">中继</text><circle cx="571" cy="668" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="571" cy="668" r="10" fill="#c4a7ee"/><text x="571" y="756" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">出口</text><circle cx="285" cy="668" r="44" fill="#1b1e2e" stroke="#a9dec8" stroke-width="3"/><circle cx="285" cy="668" r="10" fill="#a9dec8"/><text x="285" y="756" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">HTTPS 网站</text><text x="64" y="829" fill="#c2b9d1" font-size="23" text-anchor="start" font-weight="400">网站看到 Tor 出口；代理服务方仍可能知道连接来源。访问 .onion 时不走此处的普通出口。</text>
<path d="M64 892 H1376" stroke="#39354b"/><text x="64" y="929" fill="#c2b9d1" font-size="18" text-anchor="start" font-weight="400">概念与观察分开记录 · 示意图不代表真实物理距离或规模</text><text x="1376" y="929" fill="#c4a7ee" font-size="18" text-anchor="end" font-weight="400">zengzimo.cn</text>
</g></svg>