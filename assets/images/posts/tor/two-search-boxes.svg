<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">“还是 DuckDuckGo”并不是看错了</title><desc id="desc">实测已设Ahmia为普通和隐私搜索引擎，但Tor内置欢迎页单独使用DuckDuckGo。主页已替换，Ahmia查询仍返回首页，搜索功能未验证通过。</desc>
<defs><radialGradient id="glow"><stop stop-color="#30273f"/><stop offset="1" stop-color="#11131f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4a7ee"/></marker></defs>
<rect width="1440" height="960" rx="0" fill="url(#glow)"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="64" y="64" fill="#c4a7ee" font-size="18" text-anchor="start" font-weight="400">ZIMO / TOR FIELD NOTES</text><text x="1376" y="64" fill="#c2b9d1" font-size="16" text-anchor="end" font-weight="400">EXPLANATORY FIGURE</text>
<text x="64" y="139" fill="#f6f1fd" font-size="46" text-anchor="start" font-weight="600">“还是 DuckDuckGo”并不是看错了</text><text x="64" y="190" fill="#c2b9d1" font-size="24" text-anchor="start" font-weight="400">两个看起来相似的搜索框，可以由完全不同的代码控制。</text>
<rect x="64" y="248" width="631" height="345" rx="20" fill="#1b1e2e" stroke="#39354b"/><rect x="727" y="248" width="649" height="345" rx="20" fill="#1b1e2e" stroke="#39354b"/><text x="96" y="300" fill="#a9dec8" font-size="27" text-anchor="start" font-weight="400">地址栏 / 浏览器搜索引擎</text><rect x="96" y="336" width="567" height="75" rx="12" fill="#202f2e" stroke="#608875"/><text x="119" y="384" fill="#a9dec8" font-size="29" text-anchor="start" font-weight="400">Ahmia  ·  搜索词</text><text x="96" y="476" fill="#c2b9d1" font-size="26" text-anchor="start" font-weight="400">普通模式：Ahmia</text><text x="96" y="515" fill="#c2b9d1" font-size="26" text-anchor="start" font-weight="400">隐私模式：Ahmia</text><text x="96" y="554" fill="#c2b9d1" font-size="26" text-anchor="start" font-weight="400">设置与实际查询是两件事</text><text x="760" y="300" fill="#e4bd86" font-size="27" text-anchor="start" font-weight="400">Tor 内置欢迎页搜索框</text><rect x="760" y="336" width="583" height="75" rx="12" fill="#302b2b" stroke="#866e51"/><text x="785" y="384" fill="#e4bd86" font-size="29" text-anchor="start" font-weight="400">DuckDuckGo</text><text x="760" y="476" fill="#c2b9d1" font-size="24" text-anchor="start" font-weight="400">此版本主页的独立实现</text><text x="760" y="515" fill="#c2b9d1" font-size="24" text-anchor="start" font-weight="400">不跟随地址栏默认引擎</text><text x="760" y="554" fill="#c2b9d1" font-size="24" text-anchor="start" font-weight="400">本次改为 Ahmia 主页 + 空白新标签</text><rect x="64" y="628" width="1312" height="211" rx="20" fill="#292334" stroke="#6d527b"/><text x="100" y="679" fill="#c4a7ee" font-size="29" text-anchor="start" font-weight="400">另一个没解决的问题</text><text x="100" y="731" fill="#c2b9d1" font-size="27" text-anchor="start" font-weight="400">Ahmia 首页打开了，但测试查询与正常表单提交都回到了首页。</text><text x="100" y="782" fill="#c2b9d1" font-size="27" text-anchor="start" font-weight="400">因此不能写“搜索已经完全正常”，更不能用首页截图代替结果页证据。</text>
<path d="M64 892 H1376" stroke="#39354b"/><text x="64" y="929" fill="#c2b9d1" font-size="18" text-anchor="start" font-weight="400">概念与观察分开记录 · 示意图不代表真实物理距离或规模</text><text x="1376" y="929" fill="#c4a7ee" font-size="18" text-anchor="end" font-weight="400">zengzimo.cn</text>
</g></svg>