<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">先把三个词分开</title><desc id="desc">可公开索引内容与深网不同，暗网只是需要特定网络或软件访问的部分；Tor 也可访问公开网站。</desc>
<defs><radialGradient id="glow"><stop stop-color="#30273f"/><stop offset="1" stop-color="#11131f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4a7ee"/></marker></defs>
<rect width="1440" height="960" rx="0" fill="url(#glow)"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="64" y="64" fill="#c4a7ee" font-size="18" text-anchor="start" font-weight="400">ZIMO / TOR FIELD NOTES</text><text x="1376" y="64" fill="#c2b9d1" font-size="16" text-anchor="end" font-weight="400">EXPLANATORY FIGURE</text>
<text x="64" y="139" fill="#f6f1fd" font-size="46" text-anchor="start" font-weight="600">先把三个词分开</text><text x="64" y="190" fill="#c2b9d1" font-size="24" text-anchor="start" font-weight="400">这不是按比例绘制的冰山图，也不估算所谓“暗网占比”。</text>
<rect x="64" y="250" width="1312" height="183" rx="20" fill="#242335" stroke="#39354b"/><text x="102" y="302" fill="#c4a7ee" font-size="27" text-anchor="start" font-weight="400">SURFACE WEB / 可索引的公开内容</text><text x="102" y="363" fill="#f6f1fd" font-size="38" text-anchor="start" font-weight="400">新闻、博客、公开文档</text><text x="1300" y="363" fill="#c2b9d1" font-size="25" text-anchor="end" font-weight="400">普通浏览器即可访问</text><rect x="64" y="461" width="1312" height="375" rx="20" fill="#1b1e2e" stroke="#39354b"/><text x="102" y="518" fill="#c4a7ee" font-size="27" text-anchor="start" font-weight="400">DEEP WEB / 未被公开索引的内容</text><text x="102" y="596" fill="#c2b9d1" font-size="29" text-anchor="start" font-weight="400">私人邮箱、登录后的网盘</text><text x="102" y="639" fill="#c2b9d1" font-size="29" text-anchor="start" font-weight="400">数据库、付费或内部系统</text><text x="102" y="682" fill="#c2b9d1" font-size="29" text-anchor="start" font-weight="400">未索引 ≠ 非法，也不必然使用 Tor</text><rect x="775" y="550" width="551" height="235" rx="20" fill="#302940" stroke="#8f76ae"/><text x="810" y="603" fill="#a9dec8" font-size="25" text-anchor="start" font-weight="400">DARK WEB / 特殊网络中的一部分</text><text x="810" y="663" fill="#c2b9d1" font-size="25" text-anchor="start" font-weight="400">例如 Tor 的 .onion 服务</text><text x="810" y="706" fill="#c2b9d1" font-size="25" text-anchor="start" font-weight="400">不是 deep web 的同义词</text><text x="810" y="749" fill="#c2b9d1" font-size="25" text-anchor="start" font-weight="400">Tor 也能访问普通公开网站</text>
<path d="M64 892 H1376" stroke="#39354b"/><text x="64" y="929" fill="#c2b9d1" font-size="18" text-anchor="start" font-weight="400">概念与观察分开记录 · 示意图不代表真实物理距离或规模</text><text x="1376" y="929" fill="#c4a7ee" font-size="18" text-anchor="end" font-weight="400">zengzimo.cn</text>
</g></svg>