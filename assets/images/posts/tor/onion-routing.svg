<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">不是一条“超级加密隧道”</title><desc id="desc">普通网站的典型三跳 Tor 电路。入口、中继、出口分别知道不同信息；HTTPS 在应用层端到端加密。这里只表示常规流量模型，并非抗所有观察者的证明。</desc>
<defs><radialGradient id="glow"><stop stop-color="#30273f"/><stop offset="1" stop-color="#11131f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4a7ee"/></marker></defs>
<rect width="1440" height="960" rx="0" fill="url(#glow)"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="64" y="64" fill="#c4a7ee" font-size="18" text-anchor="start" font-weight="400">ZIMO / TOR FIELD NOTES</text><text x="1376" y="64" fill="#c2b9d1" font-size="16" text-anchor="end" font-weight="400">EXPLANATORY FIGURE</text>
<text x="64" y="139" fill="#f6f1fd" font-size="46" text-anchor="start" font-weight="600">不是一条“超级加密隧道”</text><text x="64" y="190" fill="#c2b9d1" font-size="24" text-anchor="start" font-weight="400">典型的公开网站访问：客户端 → 入口守卫 → 中继 → 出口 → 网站。</text>
<path d="M185 354 L373 354" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M475 354 L663 354" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M765 354 L953 354" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1055 354 L1243 354" fill="none" stroke="#c4a7ee" stroke-width="4"  marker-end="url(#arrow)"/><circle cx="135" cy="354" r="44" fill="#1b1e2e" stroke="#a9dec8" stroke-width="3"/><circle cx="135" cy="354" r="10" fill="#a9dec8"/><text x="135" y="442" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">浏览器</text><text x="135" y="479" fill="#c2b9d1" font-size="20" text-anchor="middle" font-weight="400">构造整条电路</text><circle cx="425" cy="354" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="425" cy="354" r="10" fill="#c4a7ee"/><text x="425" y="442" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">入口守卫</text><text x="425" y="479" fill="#c2b9d1" font-size="20" text-anchor="middle" font-weight="400">Guard</text><circle cx="715" cy="354" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="715" cy="354" r="10" fill="#c4a7ee"/><text x="715" y="442" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">中继</text><text x="715" y="479" fill="#c2b9d1" font-size="20" text-anchor="middle" font-weight="400">Middle</text><circle cx="1005" cy="354" r="44" fill="#1b1e2e" stroke="#c4a7ee" stroke-width="3"/><circle cx="1005" cy="354" r="10" fill="#c4a7ee"/><text x="1005" y="442" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">出口</text><text x="1005" y="479" fill="#c2b9d1" font-size="20" text-anchor="middle" font-weight="400">Exit</text><circle cx="1295" cy="354" r="44" fill="#1b1e2e" stroke="#a9dec8" stroke-width="3"/><circle cx="1295" cy="354" r="10" fill="#a9dec8"/><text x="1295" y="442" fill="#f6f1fd" font-size="27" text-anchor="middle" font-weight="400">HTTPS 站点</text><text x="1295" y="479" fill="#c2b9d1" font-size="20" text-anchor="middle" font-weight="400">Public website</text><rect x="64" y="540" width="1312" height="103" rx="20" fill="#182c2c" stroke="#416658"/><text x="100" y="582" fill="#a9dec8" font-size="29" text-anchor="start" font-weight="400">HTTPS / TLS：从浏览器一直到目标网站的应用层加密</text><text x="100" y="620" fill="#c2b9d1" font-size="23" text-anchor="start" font-weight="400">出口之外仍需 HTTPS；Tor 不替代目标站点的传输加密。</text><rect x="64" y="679" width="418" height="155" rx="20" fill="#1b1e2e" stroke="#39354b"/><text x="88" y="722" fill="#c4a7ee" font-size="27" text-anchor="start" font-weight="400">入口守卫</text><text x="88" y="765" fill="#c2b9d1" font-size="22" text-anchor="start" font-weight="400">知道直接连接它的来源</text><text x="88" y="799" fill="#c2b9d1" font-size="22" text-anchor="start" font-weight="400">不知道最终目标站点</text><rect x="511" y="679" width="418" height="155" rx="20" fill="#1b1e2e" stroke="#39354b"/><text x="535" y="722" fill="#c4a7ee" font-size="27" text-anchor="start" font-weight="400">中继</text><text x="535" y="765" fill="#c2b9d1" font-size="22" text-anchor="start" font-weight="400">看到前后相邻节点</text><text x="535" y="799" fill="#c2b9d1" font-size="22" text-anchor="start" font-weight="400">不掌握完整通信两端</text><rect x="958" y="679" width="418" height="155" rx="20" fill="#1b1e2e" stroke="#39354b"/><text x="982" y="722" fill="#c4a7ee" font-size="27" text-anchor="start" font-weight="400">出口</text><text x="982" y="765" fill="#c2b9d1" font-size="22" text-anchor="start" font-weight="400">知道访问的目标</text><text x="982" y="799" fill="#c2b9d1" font-size="22" text-anchor="start" font-weight="400">非 HTTPS 内容可能被读取</text>
<path d="M64 892 H1376" stroke="#39354b"/><text x="64" y="929" fill="#c2b9d1" font-size="18" text-anchor="start" font-weight="400">概念与观察分开记录 · 示意图不代表真实物理距离或规模</text><text x="1376" y="929" fill="#c4a7ee" font-size="18" text-anchor="end" font-weight="400">zengzimo.cn</text>
</g></svg>